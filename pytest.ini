[pytest]
testpaths = backend/tests
python_files = test_*.py
filterwarnings =
    # Historical guard: the default `jwt_secret` used to be 23 bytes, below
    # RFC 7518's 32-byte minimum for HS256, and PyJWT warned on every call.
    # PR002 fixed the default (70 bytes) and added a validator that refuses
    # shorter secrets at startup; the filter stays so any regression that
    # reintroduces a short key is still surfaced rather than failing the suite
    # with a warning storm.
    ignore:The HMAC key is .* bytes long:UserWarning
