# BROBOND AI STUDIO — Render Blueprint (CI/CD)
#
# One-time deploy (with the Render CLI):
#   render login
#   render blueprint deploy --path render.yaml
#
# After that, every push to the default branch (main) triggers an automatic
# deploy of the web service and the API — no extra CI step required.
#
# Schema notes (current Blueprint spec, https://render.com/docs/blueprint-spec):
#   - `autoDeployTrigger: commit` replaces the deprecated `autoDeploy: true`.
#   - Blueprint `databases` entries have no `type` key: every entry is a managed
#     PostgreSQL instance by definition.
#   - `region` is left off the database on purpose: it defaults to `oregon`,
#     i.e. the same region the two services pin.

services:
  # ---------------------------------------------------------------- Next.js UI
  - type: web
    name: brobond-studio-web
    runtime: node
    plan: free
    region: oregon
    # `npm ci` alone only installs dependencies: `.next/` is gitignored, so
    # without `npm run build` the `next start` step dies with
    # "Could not find a production build in the '.next' directory".
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      # NEXT_PUBLIC_* values are baked in at build time. Keep it in sync with
      # the public URL of the API service below ({service-name}.onrender.com).
      - key: NEXT_PUBLIC_API_URL
        value: https://brobond-ai-api.onrender.com

  # --------------------------------------------------------------- FastAPI API
  - type: web
    name: brobond-ai-api
    runtime: docker
    dockerfilePath: Dockerfile.api
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      # Render injects `postgres://...`; backend/app/core/config.py normalizes
      # it to a SQLAlchemy-compatible `postgresql+psycopg://` URL.
      - key: BROBOND_DATABASE_URL
        fromDatabase:
          name: brobond-studio-db
          property: connectionString
      - key: BROBOND_JWT_SECRET
        generateValue: true
      # Comma-separated; backend trims whitespace and ignores empty entries.
      - key: BROBOND_CORS_ORIGINS
        value: "https://brobond-studio-web.onrender.com,http://localhost:3000"
      # Orchestration-only mode: no GPU inference, no external queue/storage.
      # Flip these on once real providers are wired (see ROADMAP.md).
      - key: BROBOND_QUEUE_ENABLED
        value: "false"
      - key: BROBOND_STORAGE_ENABLED
        value: "false"
      - key: BROBOND_INFERENCE_ENABLED
        value: "false"
      - key: BROBOND_TRAINING_ENABLED
        value: "false"
      # PR011 — external GPU cluster. `sync: false` means Render prompts for
      # the value at deploy time and keeps it out of this file and out of git.
      # Leaving both blank is a valid deploy: readiness reports
      # `gpu.available: false` and every non-rendering route works.
      - key: BROBOND_RUNPOD_API_KEY
        sync: false
      - key: BROBOND_RUNPOD_ENDPOINT
        sync: false
      - key: BROBOND_GPU_TIMEOUT
        value: "300"
      - key: BROBOND_GPU_POLL_INTERVAL
        value: "2"

databases:
  # Render-managed PostgreSQL. Redis is not available in blueprints; while
  # BROBOND_QUEUE_ENABLED=false the API runs jobs in-process and needs no
  # Redis. When you add a Celery worker, create a Render Redis (dashboard)
  # and set BROBOND_REDIS_URL on the API service manually.
  - name: brobond-studio-db
    plan: free
    # Pinned explicitly: omitting it makes Render provision the newest major
    # version, and the value is immutable after creation (changing it on an
    # existing database requires recreating the instance).
    postgresMajorVersion: "16"
