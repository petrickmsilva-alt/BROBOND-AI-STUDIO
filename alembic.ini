# Alembic configuration for BROBOND AI STUDIO (PR002).
#
# The URL is intentionally not set here: `alembic/env.py` reads
# `BROBOND_DATABASE_URL` through `app.core.config.settings`, so the CLI, the
# API bootstrap (`app.main._bootstrap_database`) and the tests all use the
# same database the application actually runs on.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
