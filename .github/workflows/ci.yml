name: BROBOND CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # On failure the failed tests are mirrored into the check-run summary:
      # log downloads can be unavailable, and the summary is always readable.
      - run: |
          set -o pipefail
          if ! PYTHONPATH=backend pytest backend/tests -q 2>&1 | tee /tmp/pytest.log; then
            {
              echo "## Backend tests failed"
              echo '```'
              grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -25 || true
              echo '```'
              echo '```'
              tail -15 /tmp/pytest.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
      # PR005: the 95% floor is enforced, not just reported. The denominator
      # includes the four dead modules from AUDIT.md P0-1 (100 statements, 0%),
      # so this number is conservative by construction — see
      # backend/tests/test_dead_module_boundary.py.
      - name: Coverage gate (95%)
        run: |
          PYTHONPATH=backend coverage run --source=backend/app -m pytest backend/tests -q
          coverage report --include='backend/app/*' --skip-empty --fail-under=95
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # PR004.1 + PR006: Project Memory and StoryboardState behavioral suites
      # with a 95% coverage gate (vitest, scoped to lib/memory/ and lib/storyboard/).
      - name: Frontend contract tests (Memory + Storyboard)
        run: npm run test:frontend:coverage
      - run: npm run build
