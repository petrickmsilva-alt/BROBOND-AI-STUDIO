services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brobond
      POSTGRES_PASSWORD: brobond_local
      POSTGRES_DB: brobond
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: brobond
      MINIO_ROOT_PASSWORD: brobond_local_storage
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      BROBOND_DATABASE_URL: postgresql+psycopg://brobond:brobond_local@postgres:5432/brobond
      BROBOND_REDIS_URL: redis://redis:6379/0
      BROBOND_QUEUE_ENABLED: "true"
      BROBOND_STORAGE_ENABLED: "true"
      BROBOND_MINIO_ENDPOINT: http://minio:9000
      BROBOND_MINIO_ACCESS_KEY: brobond
      BROBOND_MINIO_SECRET_KEY: brobond_local_storage
      # Local-dev secret (63 bytes). Replace in any real deployment: the API
      # refuses to boot with a secret shorter than 32 bytes (PR002).
      BROBOND_JWT_SECRET: brobond-compose-local-dev-0123456789-abcdefghijklmnopqrstuvwxyz
      # Auth rate limit (attempts per client IP per minute, per process; 0 disables).
      BROBOND_RATE_LIMIT_AUTH_PER_MINUTE: "20"
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["celery", "-A", "app.queue.celery_app", "worker", "--loglevel=info", "--workdir=backend"]
    environment:
      BROBOND_DATABASE_URL: postgresql+psycopg://brobond:brobond_local@postgres:5432/brobond
      BROBOND_REDIS_URL: redis://redis:6379/0
      BROBOND_QUEUE_ENABLED: "true"
      BROBOND_STORAGE_ENABLED: "true"
      BROBOND_MINIO_ENDPOINT: http://minio:9000
      BROBOND_MINIO_ACCESS_KEY: brobond
      BROBOND_MINIO_SECRET_KEY: brobond_local_storage
      # Must match the API's secret so worker-side token validation agrees.
      BROBOND_JWT_SECRET: brobond-compose-local-dev-0123456789-abcdefghijklmnopqrstuvwxyz
      BROBOND_RATE_LIMIT_AUTH_PER_MINUTE: "20"
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
